<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knightmare TS Port</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f3554 0%, #10192a 55%, #080d16 100%);
        color: #f6f2d8;
        font-family: "Consolas", "Courier New", monospace;
      }
      .wrap {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      #game {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 2px solid #f6f2d8;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .hint {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <canvas id="game" width="320" height="200"></canvas>
      <div class="hint">Arrow keys: move, Space: fire (placeholder), Enter: restart stage</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
